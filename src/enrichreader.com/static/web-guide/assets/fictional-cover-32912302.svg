<svg xmlns="http://www.w3.org/2000/svg" width="180" height="270" viewBox="32 88 180 270"><rect width="640" height="800" rx="24" fill="#f4f2ed"/><text x="32" y="48" font-family="Arial,sans-serif" font-size="18" fill="#51576e">EXEMPLO · LIVRO E AUTORA FICTÍCIOS</text><rect x="32" y="88" width="180" height="270" rx="6" fill="#263854"/><path d="M32 270 Q77 230 122 270 T212 270 V358H32Z" fill="#7db2b8"/><path d="M32 290 Q77 250 122 290 T212 290" fill="none" stroke="#cbe4dc" stroke-width="3"/><text x="52" y="132" font-family="Georgia,serif" font-size="22" fill="#f2f2ea">As Marés</text><text x="52" y="160" font-family="Georgia,serif" font-size="22" fill="#f2f2ea">de Ondina</text><g fill="#25283a"><text x="240" y="112" font-family="Arial,sans-serif" font-size="15">GUIA OFICIAL SEM SPOILER</text><text x="240" y="158" font-family="Georgia,serif" font-size="29">As Marés de Ondina</text><text x="240" y="194" font-family="Arial,sans-serif" font-size="19">de Autora Exemplo</text><text x="240" y="226" font-family="Arial,sans-serif" font-size="17">✓ aprovou este guia</text><text x="32" y="424" font-family="Georgia,serif" font-size="28">Sobre a série</text><text x="32" y="470" font-family="Georgia,serif" font-size="21">Na vila de Ondina, o mar recua um pouco</text><text x="32" y="504" font-family="Georgia,serif" font-size="21">a cada lua. Quando a avó de Lia some na</text><text x="32" y="538" font-family="Georgia,serif" font-size="21">maré mais baixa do século, ela encontra</text><text x="32" y="572" font-family="Georgia,serif" font-size="21">no farol um caderno escrito com a sua</text><text x="32" y="606" font-family="Georgia,serif" font-size="21">própria letra.</text><text x="32" y="644" font-family="Arial,sans-serif" font-size="16">por Autora Exemplo</text><text x="32" y="706" font-family="Arial,sans-serif" font-size="17">Livro 2 · sai em mar. 2027</text><text x="32" y="736" font-family="Arial,sans-serif" font-size="17">Pré-venda no Catarse ↗</text></g></svg>