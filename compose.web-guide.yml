services:
  reports-init:
    image: node:24-alpine
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    volumes:
      - reports:/reports
    command: [node, -e, "const fs=require('node:fs');fs.mkdirSync('/reports/data',{recursive:true,mode:0o700});fs.chownSync('/reports/data',1000,1000)"]
  web-guide:
    image: node:24-alpine
    restart: unless-stopped
    user: node
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      WEB_GUIDE_HOST: 0.0.0.0
      WEB_GUIDE_TRUST_PROXY: "1"
      WEB_GUIDE_PORT: 3003
      WEB_GUIDE_REPORT_DIR: /reports/data
      WEB_GUIDE_ACCESS_CONFIG: /reports/data/access.json
      WEB_GUIDE_SHOWCASE_CONFIG: /reports/data/showcases.json
      WEB_GUIDE_WHATSAPP: ${WEB_GUIDE_WHATSAPP-5511953664050}
      WEB_GUIDE_AUTHOR_APP_READY: ${WEB_GUIDE_AUTHOR_APP_READY:-0}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    depends_on:
      reports-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3003:3003"
    volumes:
      - ./src/enrichreader.com:/site:ro
      - ./public/enrichreader.com:/public/enrichreader.com:ro
      - reports:/reports
    command: [node, /site/lib/web-guide/server.mjs]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3003/web-guide/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Fast checks only while starting, so `up --wait` returns quickly during deploys.
      start_period: 60s
      start_interval: 1s
volumes:
  reports:
